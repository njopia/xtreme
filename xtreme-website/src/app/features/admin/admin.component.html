<div class="admin">
  <div class="admin__header">
    <h1 class="admin__title">Panel de administración</h1>
    <p class="admin__subtitle">Gestiona usuarios, foros y servidores</p>
  </div>

  <mat-tab-group class="admin__tabs" animationDuration="200ms">
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon>group</mat-icon>
        Usuarios
      </ng-template>
      <div class="admin__tab-content">
        <app-user-management />
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon>sports_esports</mat-icon>
        Servidores
      </ng-template>
      <div class="admin__tab-content">
        <app-server-stats />
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
