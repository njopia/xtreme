name: Build & Deploy
on:
  push:
    branches: [main]
    paths:
      - 'xtreme-website/**'
      - 'api/**'
  workflow_dispatch:
jobs:
  deploy:
    name: Build & Deploy to VDS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xtreme-website/package-lock.json

      - name: Install dependencies
        working-directory: xtreme-website
        run: npm ci --prefer-offline

      - name: Build production
        working-directory: xtreme-website
        run: npm run build:prod

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Debug - List Build Files
        run: |
          echo "--- Contenido del build del Frontend ---"
          ls -R xtreme-website/dist/xtreme-website/browser/ | head -n 20
          echo "--- Contenido de la carpeta API ---"
          ls -R api/ | head -n 20

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VDS_PORT }} ${{ secrets.VDS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend via rsync
        run: |
          TARGET_PATH="/var/www/html/xtreme-website"
          rsync -azv --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VDS_PORT }} -o StrictHostKeyChecking=yes" \
            xtreme-website/dist/xtreme-website/browser/ \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:$TARGET_PATH/

      - name: Deploy API via rsync
        run: |
          TARGET_API_PATH="/var/www/html/api"
          if [ -z "$TARGET_API_PATH" ] || [ "$TARGET_API_PATH" == "/" ]; then
            echo "CRITICAL ERROR: Destino no válido. Abortando."
            exit 1
          fi
          rsync -azvi --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='/proc' \
            --exclude='/sys' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VDS_PORT }} -o StrictHostKeyChecking=yes" \
            api/ \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:$TARGET_API_PATH/

      - name: Debug - Remote Check
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VDS_PORT }} -o StrictHostKeyChecking=yes \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} \
            "ls -ld /var/www/html/api /var/www/html/xtreme-website && du -sh /var/www/html/api"

      - name: Install API deps & restart
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VDS_PORT }} -o StrictHostKeyChecking=yes \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} \
            "cd /var/www/html/api && npm ci --omit=dev && pm2 restart xtreme-api || pm2 start ecosystem.config.cjs"

      - name: Smoke test
        run: |
          sleep 5
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.VDS_HOST }})
          if [ "$CODE" != "200" ] && [ "$CODE" != "301" ] && [ "$CODE" != "302" ]; then
            echo "Smoke test failed — status $CODE"
            exit 1
          fi
          echo "Deploy exitoso en Debian 13"