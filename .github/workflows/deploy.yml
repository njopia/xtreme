name: Build & Deploy
on:
  push:
    branches: [main]
    paths:
      - 'xtreme-website/**'
      - 'api/**'
  workflow_dispatch:
jobs:
  deploy:
    name: Build & Deploy to VDS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xtreme-website/package-lock.json

      - name: Install dependencies
        working-directory: xtreme-website
        run: npm ci --prefer-offline

      - name: Build production
        working-directory: xtreme-website
        run: npm run build:prod

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VDS_PORT }} ${{ secrets.VDS_HOST }} >> ~/.ssh/known_hosts

      - name: Create remote directories
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VDS_PORT }} -o StrictHostKeyChecking=yes \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} \
            "mkdir -p /var/www/html/xtreme-website /var/www/html/xtreme-api"

      - name: Deploy frontend via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VDS_PORT }} -o StrictHostKeyChecking=yes" \
            xtreme-website/dist/xtreme-website/browser/ \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:/var/www/html/xtreme-website/

      - name: Deploy API via rsync
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VDS_PORT }} -o StrictHostKeyChecking=yes" \
            api/ \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:/var/www/html/xtreme-api/

      - name: Setup Node.js & PM2 + restart API
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VDS_PORT }} -o StrictHostKeyChecking=yes \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} << 'EOF'
            export PATH="/usr/bin:/usr/local/bin:/usr/local/sbin:$PATH"

            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
              sudo apt-get install -y nodejs
              export PATH="/usr/bin:/usr/local/bin:/usr/local/sbin:$PATH"
            fi

            echo "Node: $(node -v)"
            echo "NPM: $(npm -v)"

            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
              pm2 startup systemd -u deploy --hp /home/deploy | tail -1 | sudo bash
              export PATH="/usr/bin:/usr/local/bin:/usr/local/sbin:$PATH"
            fi

            echo "PM2: $(pm2 -v)"

            cd /var/www/html/xtreme-api
            npm ci --omit=dev

            pm2 restart xtreme-api 2>/dev/null || pm2 start ecosystem.config.cjs
            pm2 save
          EOF

      - name: Smoke test
        run: |
          sleep 5
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.VDS_HOST }})
          if [ "$CODE" != "200" ] && [ "$CODE" != "301" ] && [ "$CODE" != "302" ]; then
            echo "Smoke test failed — status $CODE"
            exit 1
          fi
          echo "Deploy exitoso en Debian 13"