name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'xtreme-website/**'

  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to VDS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xtreme-website/package-lock.json

      - name: Install dependencies
        working-directory: xtreme-website
        run: npm ci --prefer-offline

      - name: Build production
        working-directory: xtreme-website
        run: npm run build:prod

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VDS_PORT }} ${{ secrets.VDS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VDS_PORT }} -o StrictHostKeyChecking=yes" \
            xtreme-website/dist/xtreme-website/browser/ \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:${{ secrets.VDS_PATH }}/

      - name: Smoke test
        run: |
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.VDS_HOST }})
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "301" ] && [ "$STATUS" != "302" ]; then
            echo "Smoke test failed — status $STATUS"
            exit 1
          fi
          echo "Deploy OK"